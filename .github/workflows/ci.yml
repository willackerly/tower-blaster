name: ci
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's run still in progress; main's runs all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: typecheck and bench self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Benchmark harness self-check (A/A and injected slowdown)
        run: pnpm bench selfcheck

  # The suite is CPU-bound on SwiftShader (a 4-core runner stays saturated), so it
  # runs as shards on separate runners. planShards (vitest.config.ts) balances them
  # on vitest.durations.json; refresh it with `pnpm test:durations` when files are
  # added or get slower.
  test:
    name: test ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # A shard takes ~3-4 min; runners vary ~2x.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # GPU-correctness tests must run (on SwiftShader) rather than skip.
      REQUIRE_WEBGPU: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No apt: Chrome brings its own Vulkan loader and SwiftShader (WebGPU works with the
      # system libvulkan removed), and the runner image already has Chromium's
      # libraries, so a slow apt mirror can't stall the run.
      - run: pnpm exec playwright install chromium
      - run: pnpm test --shard=${{ matrix.shard }}/4

  # The one status to require: green only when every job above is. Skipped, not
  # failed, when a newer push cancels the run.
  check:
    needs: [static, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.static.result }}" = success && test "${{ needs.test.result }}" = success
