name: nightly
# The slow tier (O5): every case PR and main CI leave out, on main once a night
# and by hand (Actions tab, Run workflow). PHYSICS_GPU_SLOW=1 turns on each
# file's slow cases and the nightly-only files (vitest.nightly.json); TB_TIER=slow
# runs only those files, not the whole suite again. A failure opens an issue
# labelled `nightly` (or comments on the open one), since no PR shows it.
#
# GitHub drops or delays scheduled runs under load: 06:30 on 2026-11-08 ran 7 h late, on 2026-11-09 not at all.
# So two later slots back it up, and `gate` lets a scheduled run go ahead only when no nightly has run yet that
# UTC day (a hand dispatch counts). A run by hand always goes ahead.
on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '40 9 * * *'
    - cron: '50 13 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # Today's other nightly runs that were not cancelled (a skipped one counts: it saw an earlier run).
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?created=>=$(date -u +%F)&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")] | length")
          echo "nightly runs already today: $n"
          if [ "$n" = 0 ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  slow:
    name: slow ${{ matrix.shard }}/6
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # One file can take hours on SwiftShader (chorus-gpu 154 min, e2e-keystone-10k 73 min in the first
    # nightly, run 42394058839), and a file runs on one worker: the plan's longest shard is ~154 min.
    # GitHub's limit for a job is 360.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      REQUIRE_WEBGPU: '1'
      PHYSICS_GPU_SLOW: '1'
      TB_TIER: slow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test --shard=${{ matrix.shard }}/6 --reporter=default --reporter=json --outputFile.json=.vitest-report.json
      # Times for vitest.durations.nightly.json: pnpm durations --file vitest.durations.nightly.json --from-log <log>.
      - name: Shard file times
        if: ${{ !cancelled() }}
        run: pnpm durations --print .vitest-report.json

  report:
    needs: slow
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly issue
        run: |
          body="The nightly slow tier failed on ${GITHUB_SHA::7}: $RUN"
          open=$(gh issue list --label nightly --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else
            gh label create nightly --color B60205 --description "The nightly slow-tier run failed" 2>/dev/null || true
            gh issue create --label nightly --title "Nightly slow tests failing" --body "$body"
          fi
