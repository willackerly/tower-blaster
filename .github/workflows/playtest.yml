name: playtest
# Deploys the playtest (docs/playtest.md) after ci goes green on a push to main,
# then checks the live site from outside (pnpm playtest:smoke). Run it by hand
# from the Actions tab to redeploy main without a new push.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a new one waits for the running one (and replaces any older one waiting).
concurrency:
  group: playtest-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy and smoke
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A custom token with Account: Cloudflare Pages Edit, Workers KV Storage Edit;
      # User: User Details Read, Memberships Read (docs/playtest.md, "Deploying").
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLAYTEST_PASSWORD: ${{ secrets.PLAYTEST_PASSWORD }}
    steps:
      - name: Check the deploy secrets are set
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secret CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing variable CLOUDFLARE_ACCOUNT_ID"
          [ -n "$PLAYTEST_PASSWORD" ] || missing="$missing secret PLAYTEST_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::not set in the repo settings:$missing (docs/playtest.md, Automated deploys)"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          # The commit ci tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # ci runs can finish out of order; deploying an older commit over a newer one would roll the site back.
      - name: Skip a commit that main has moved past
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$(git rev-parse HEAD)" ]; then
            echo "::notice::main is at $tip now, so this run leaves the deploy to that commit's run"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !steps.tip.outputs.stale }}
        run: pnpm install --frozen-lockfile
      - if: ${{ !steps.tip.outputs.stale }}
        run: pnpm playtest:deploy
      - if: ${{ !steps.tip.outputs.stale }}
        run: pnpm playtest:smoke
