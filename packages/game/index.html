<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d0dbe9; font: 14px/1.45 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  kbd { font: 600 11px/1 ui-monospace, monospace; padding: 2px 4px; border-radius: 3px; background: #3a4459; color: #e8ebf2; margin-right: 2px; }
  .panel { position: fixed; background: rgba(17, 20, 28, 0.8); color: #e8ebf2; border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
  .bad { color: #f0806a; } .ok { color: #8fd3b6; } .small { font-size: 12px; }
  body.ended #hud { opacity: 0.25; }
  #hud { top: 12px; left: 12px; min-width: 250px; font-variant-numeric: tabular-nums; }
  #hud .title { font-size: 17px; font-weight: 650; margin-bottom: 4px; }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  #hud .crowns { color: #f7b955; font-weight: 650; }
  #hud .crowns.pop { animation: pop 0.35s ease-out; }
  #hud .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  #hud .chip { padding: 4px 8px; border-radius: 6px; background: #2b3242; }
  #hud .chip.on { background: #d8693f; }
  #hud .chip.spent { opacity: 0.4; }
  #hud .bar { width: 110px; height: 8px; border-radius: 4px; background: #2b3242; overflow: hidden; }
  #hud .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8fd3b6, #f7b955, #f0806a); }
  #banner { position: fixed; top: 22%; left: 0; right: 0; text-align: center; pointer-events: none; font-size: 44px; font-weight: 800; letter-spacing: 0.04em; color: #fff; text-shadow: 0 3px 18px rgba(0, 0, 0, 0.45); opacity: 0; }
  #banner.show { animation: banner 1.4s ease-out; }
  #banner.crack { color: #f0806a; }
  #help { bottom: 12px; left: 12px; font-size: 12px; color: #9aa3b8; }
  #result { top: 50%; left: 50%; transform: translate(-50%, -50%); min-width: 300px; display: none; padding: 20px 24px; font-variant-numeric: tabular-nums; }
  #result.show { display: block; animation: rise 0.3s ease-out; }
  #result .name { font-size: 22px; font-weight: 700; }
  #result .sub { color: #9aa3b8; margin-bottom: 10px; }
  #result .line { display: flex; justify-content: space-between; padding: 3px 0; opacity: 0; animation: slam 0.25s cubic-bezier(.2,1.6,.4,1) forwards; }
  #result .total { border-top: 1px solid #3a4459; margin-top: 6px; padding-top: 8px; font-size: 18px; font-weight: 700; }
  #result .stamp { display: inline-block; margin: 14px 0 4px; padding: 4px 12px; border: 3px solid #f7b955; border-radius: 6px; color: #f7b955; font-size: 24px; font-weight: 900; letter-spacing: 0.08em; transform: rotate(-6deg); opacity: 0; animation: stamp 0.35s cubic-bezier(.2,1.8,.4,1) forwards; }
  #result .stamp.s-bogey, #result .stamp.s-doublebogey, #result .stamp.s-incomplete { border-color: #9aa3b8; color: #9aa3b8; }
  #result .stars { font-size: 30px; color: #f7b955; opacity: 0; animation: slam 0.3s ease-out forwards; }
  #result .actions { display: flex; gap: 8px; margin-top: 14px; }
  #result button { font: inherit; padding: 7px 12px; border: 0; border-radius: 6px; background: #2b3242; color: #e8ebf2; cursor: pointer; }
  #result button.primary { background: #d8693f; }
  #error { top: 40%; left: 50%; transform: translate(-50%, -50%); max-width: 520px; display: none; }
  @keyframes slam { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes stamp { from { opacity: 0; transform: rotate(-6deg) scale(2.4); } to { opacity: 1; transform: rotate(-6deg) scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, -44%); } to { opacity: 1; transform: translate(-50%, -50%); } }
  @keyframes pop { 50% { transform: scale(1.5); } }
  @keyframes banner { 0% { opacity: 0; transform: scale(0.6); } 15% { opacity: 1; transform: scale(1.08); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
  @media (max-width: 640px) { #help { display: none; } #banner { font-size: 30px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="panel">loading…</div>
<div id="banner"></div>
<div id="help" class="panel">hover: aim · click: fire · drag: orbit (the launcher follows you) · wheel: zoom · <kbd>1</kbd>–<kbd>4</kbd> ammo · <kbd>Q</kbd>/<kbd>E</kbd> power · hold <kbd>Space</kbd>: fast · <kbd>R</kbd> retry · <kbd>N</kbd>/<kbd>P</kbd> level · <kbd>M</kbd> mute</div>
<div id="result" class="panel"></div>
<div id="error" class="panel"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
